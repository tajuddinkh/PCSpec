name: Clean temporary v3.0 publication workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v3-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v3.0 Release before cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v3.0 --json assets --jq '.assets | length')" = "4"
          gh release view v3.0 --json isDraft,isPrerelease,tagName,name --jq '
            select(
              .isDraft == false and
              .isPrerelease == false and
              .tagName == "v3.0" and
              .name == "PCSpec Portable v3.0"
            )' >/dev/null

      - name: Remove temporary workflow and retarget v3.0 tag to clean commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tajud Din"
          git config user.email "17818177+tajuddinkh@users.noreply.github.com"

          git rm .github/workflows/publish-v3-release.yml
          git commit -m "Remove temporary v3.0 publication workflow"
          git push origin HEAD:main

          git tag -f v3.0 HEAD
          git push origin refs/tags/v3.0 --force
